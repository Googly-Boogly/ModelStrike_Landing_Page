# Production overlay: HTTPS on 80/443 via Caddy in front of the site.
#
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
#
# Needs SITE_DOMAIN in .env (e.g. modelstrike.ai — no scheme, no www) with
# DNS for it and www.<domain> pointing at this server.

services:
  web:
    # Only Caddy talks to the app; nothing is published on the host.
    ports: !reset []

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env, e.g. modelstrike.ai}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates — keep this volume
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
